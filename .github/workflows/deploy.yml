name: Deploy approved Main revision
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Full SHA of the reviewed and approved Main commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: debouwpro-main-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected revision
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: test "$GITHUB_REF" = refs/heads/main && test "$GITHUB_SHA" = "$APPROVED_SHA"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy approved revision to the private Main Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
